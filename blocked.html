<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtue | Site Restricted</title>
  <style>
    :root {
      --primary: #198754;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --danger: #dc3545;
      --border: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: var(--text-main);
    }

    p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 20px 0;
      line-height: 1.5;
    }

    .target-url {
      word-break: break-all;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: #146c43;
    }

    .btn-secondary {
      background-color: #e9ecef;
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background-color: #dee2e6;
    }

    .pin-input-container {
      margin-top: 15px;
      display: none;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🛑</div>
    <h1>Website Restricted</h1>
    <p>Access to <span id="targetUrlText" class="target-url">this site</span> is restricted under your current Virtue accountability settings.</p>

    <div class="btn-group">
      <button id="goBackBtn" class="btn-primary">Return to Dashboard</button>
      <button id="showPinBtn" class="btn-secondary">Enter Master PIN to Proceed</button>
    </div>

    <div id="pinContainer" class="pin-input-container">
      <input type="password" id="pinInput" placeholder="Enter Master PIN" maxlength="8">
      <button id="submitPinBtn" class="btn-primary">Verify & Proceed</button>
      <div id="pinError" class="error-msg">Incorrect Master PIN.</div>
    </div>
  </div>

  <script>
    const DASHBOARD_FALLBACK = "https://tbehman.github.io/virtue-extension/";
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get("url") || "";

    if (targetUrl) {
      try {
        const domain = new URL(targetUrl).hostname.replace('www.', '');
        document.getElementById("targetUrlText").textContent = domain;
      } catch(e) {
        document.getElementById("targetUrlText").textContent = targetUrl;
      }
    }

    // Always redirect "Return to Dashboard" directly to GitHub Pages
    document.getElementById("goBackBtn").addEventListener("click", () => {
      window.location.href = DASHBOARD_FALLBACK;
    });

    document.getElementById("showPinBtn").addEventListener("click", () => {
      document.getElementById("pinContainer").style.display = "block";
      document.getElementById("showPinBtn").style.display = "none";
      document.getElementById("pinInput").focus();
    });

    document.getElementById("submitPinBtn").addEventListener("click", verifyPin);
    document.getElementById("pinInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    function verifyPin() {
      const enteredPin = document.getElementById("pinInput").value;
      const errorEl = document.getElementById("pinError");

      chrome.storage.local.get(["masterPin"], (res) => {
        if (res.masterPin && enteredPin === res.masterPin) {
          errorEl.style.display = "none";
          
          // Grant temporary bypass and navigate directly forward
          chrome.runtime.sendMessage({ type: "GRANT_TEMP_BYPASS", url: targetUrl }, () => {
            if (targetUrl) {
              window.location.href = targetUrl;
            } else {
              window.location.href = DASHBOARD_FALLBACK;
            }
          });
        } else {
          errorEl.style.display = "block";
          document.getElementById("pinInput").value = "";
        }
      });
    }
  </script>
</body>
</html>
