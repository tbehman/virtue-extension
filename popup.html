<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtue Extension</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #212529;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e9ecef;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-container img {
      height: 28px;
      width: auto;
    }
    .logo-title {
      font-weight: 800;
      font-size: 16px;
      color: #198754;
      letter-spacing: 0.5px;
    }
    .status-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .mode-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .badge-blocklist {
      background-color: #e2e3e5;
      color: #383d41;
    }
    .badge-whitelist {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #198754;
      color: white;
    }
    .btn-primary:hover {
      background-color: #146c43;
    }
    .btn-outline {
      background-color: #ffffff;
      border: 1px solid #ced4da;
      color: #495057;
    }
    .btn-outline:hover {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container">
      <img src="virtue_logo.png" alt="Virtue">
      <span class="logo-title">VIRTUE</span>
    </div>
    <span id="modeBadge" class="mode-badge badge-blocklist">🛡️ Blocklist</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="font-size: 12px; color: #6c757d;">Monitoring Status</span>
      <span style="font-size: 12px; font-weight: bold; color: #198754;">🟢 Active</span>
    </div>
    <div class="status-row">
      <span style="font-size: 12px; color: #6c757d;">Filter Mode</span>
      <span id="filterModeText" style="font-size: 12px; font-weight: 600;">Blocklist Mode</span>
    </div>
  </div>

  <button id="openDashboardBtn" class="btn btn-primary">
    📊 Open Web Dashboard
  </button>
  
  <button id="openOptionsBtn" class="btn btn-outline">
    ⚙️ Extension Settings
  </button>

  <script src="popup.js"></script>
</body>
</html>
