<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtue Web Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header with Lion Logo -->
    <header class="dashboard-header">
      <div class="logo-title-group">
        <img src="virtue_logo.png" alt="Virtue Logo" class="lion-logo">
        <h1 id="reportTitle">Accountability Report for <span id="userName">User</span></h1>
      </div>
      <div id="dateRange" class="date-badge">Loading...</div>
    </header>

    <!-- Scorecard Metrics Banner -->
    <section class="scorecard-banner">
      <div id="statusBadge" class="status-badge status-clear">🟢 ALL CLEAR</div>
      <div class="metrics-grid">
        <div class="metric-card"><span class="metric-val" id="flaggedCount">0</span><span class="metric-label">Flagged Hits</span></div>
        <div class="metric-card"><span class="metric-val" id="searchesCount">0</span><span class="metric-label">Total Searches</span></div>
        <div class="metric-card"><span class="metric-val" id="domainsCount">0</span><span class="metric-label">Domains Visited</span></div>
        <div class="metric-card"><span class="metric-val" id="activeDays">0 / 7</span><span class="metric-label">Active Days</span></div>
      </div>
    </section>

    <!-- Priority Flagged Box (Renders at top ONLY when triggered) -->
    <section id="attentionBox" class="attention-box hidden">
      <h2>⚠️ ATTENTION REQUIRED</h2>
      <ul id="flaggedList" class="flagged-list"></ul>
    </section>

    <!-- Daily Activity Bar Chart -->
    <section class="chart-section">
      <h2>📈 Daily Browsing Activity (Pages Visited Per Day)</h2>
      <div id="dailyChart" class="daily-chart-bars"></div>
    </section>

    <!-- Side-by-Side Summary Section -->
    <section class="summary-side-by-side">
      <!-- Left: Top Visited Domains -->
      <div class="summary-card">
        <h2>📊 Top Visited Domains</h2>
        <ol id="topDomainsList" class="top-domains-list"></ol>
      </div>

      <!-- Right: Search Engine Queries -->
      <div class="summary-card">
        <h2>🔍 Search Engine Queries</h2>
        <ul id="searchesList" class="searches-list"></ul>
        <button id="toggleSearchesBtn" class="btn-toggle hidden">▼ Show All Searches</button>
      </div>
    </section>

    <!-- Full History Log -->
    <section class="history-section">
      <div class="history-header">
        <h2>📊 Full History Log</h2>
        <div class="history-controls">
          <label>View: 
            <select id="groupViewSelect">
              <option value="grouped">Group by Domain</option>
              <option value="flat">Flat List</option>
            </select>
          </label>
          <label>Sort: 
            <select id="sortSelect">
              <option value="most_visited">Most Visited First</option>
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </label>
        </div>
      </div>
      <div id="fullHistoryContainer" class="history-container"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
